services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codereview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  receiver:
    build: .
    command: uvicorn app.receiver.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  worker:
    build: .
    command: python -m app.worker.main
    env_file: .env
    depends_on:
      - db

volumes:
  pgdata:
