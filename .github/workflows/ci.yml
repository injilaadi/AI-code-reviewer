name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  # TODO (Step 7): add a build-and-push job (docker/build-push-action -> GHCR/ECR)
  # and a deploy job (kubectl apply / helm upgrade) gated on the test job passing.
