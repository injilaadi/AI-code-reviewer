# Template only -- copy to secret.yaml (gitignored) and fill in real values,
# or create it imperatively instead so nothing sensitive ever touches disk:
#
#   kubectl create secret generic ai-code-reviewer-secrets \
#     --namespace ai-code-reviewer \
#     --from-literal=GITHUB_TOKEN=github_pat_xxx \
#     --from-literal=GITHUB_WEBHOOK_SECRET=your-webhook-secret \
#     --from-literal=LLM_API_KEY=your-llm-api-key
apiVersion: v1
kind: Secret
metadata:
  name: ai-code-reviewer-secrets
  namespace: ai-code-reviewer
type: Opaque
stringData:
  GITHUB_TOKEN: "REPLACE_ME"
  GITHUB_WEBHOOK_SECRET: "REPLACE_ME"
  LLM_API_KEY: "REPLACE_ME"
