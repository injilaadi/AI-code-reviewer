apiVersion: apps/v1
kind: Deployment
metadata:
  name: receiver
  namespace: ai-code-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: receiver
  template:
    metadata:
      labels:
        app: receiver
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16
          command:
            - sh
            - -c
            - until pg_isready -h postgres -p 5432 -U postgres; do echo waiting for postgres; sleep 2; done
      containers:
        - name: receiver
          image: ai-code-reviewer:local  # built locally, loaded into kind/minikube
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.receiver.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-code-reviewer-config
            - secretRef:
                name: ai-code-reviewer-secrets
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: receiver
  namespace: ai-code-reviewer
spec:
  selector:
    app: receiver
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
